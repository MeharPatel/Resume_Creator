name: Deploy Vite Frontend to Netlify

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"   # frontend-only deploys

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/front/package-lock.json

      - name: Install dependencies
        working-directory: frontend/front
        run: npm ci

      - name: Build Vite app
        working-directory: frontend/front
        run: npm run build

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --prod --dir=frontend/front/dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
